[project]
name = "rocket-landing-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SUJITH PEDAPATI", email = "pedapatisujith@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[box2d]>=1.4.0",
    "imageio-ffmpeg>=0.6.0",
